<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIMCRS God Mode — Command Centre</title>
    <link rel="stylesheet" href="/static/admin/admin.css">
</head>
<body>
    <!-- Top Bar -->
    <header class="topbar">
        <div class="topbar-left">
            <span class="god-badge">GOD MODE</span>
            <h1>AIMCRS Command Centre</h1>
        </div>
        <div class="topbar-right">
            <span class="health-dot" id="healthDot"></span>
            <span id="healthText">Checking...</span>
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/simulation" class="nav-link sim-link">Simulation</a>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="tabs">
        <button class="tab active" data-panel="pipeline">Pipeline Control</button>
        <button class="tab" data-panel="logs">Live Logs</button>
        <button class="tab" data-panel="models">Models</button>
        <button class="tab" data-panel="system">System</button>
    </nav>

    <!-- Pipeline Control Panel -->
    <section id="panel-pipeline" class="panel active">
        <div class="panel-header">
            <h2>Pipeline Control</h2>
            <button class="btn btn-gold" onclick="runAllSteps()">Run All Steps</button>
        </div>
        <div class="pipeline-flow" id="pipelineFlow"></div>
        <div class="console" id="taskConsole">
            <div class="console-header">
                <span>Task Output</span>
                <button class="btn btn-sm" onclick="clearConsole()">Clear</button>
            </div>
            <div class="console-body" id="consoleBody">
                <p class="console-placeholder">Select a pipeline step to run...</p>
            </div>
        </div>
        <div class="status-grid" id="pipelineStatus"></div>
    </section>

    <!-- Logs Panel -->
    <section id="panel-logs" class="panel">
        <div class="panel-header">
            <h2>Live Logs</h2>
            <select id="logSelect" onchange="loadLog(this.value)">
                <option value="">Select log file...</option>
            </select>
        </div>
        <div class="console log-console">
            <div class="console-header">
                <span id="logFileName">No log selected</span>
                <div>
                    <label><input type="checkbox" id="autoScroll" checked> Auto-scroll</label>
                    <button class="btn btn-sm" onclick="refreshLog()">Refresh</button>
                </div>
            </div>
            <div class="console-body log-body" id="logBody">
                <p class="console-placeholder">Select a log file to view...</p>
            </div>
        </div>
    </section>

    <!-- Models Panel -->
    <section id="panel-models" class="panel">
        <div class="panel-header">
            <h2>Model Management</h2>
            <button class="btn btn-sm" onclick="refreshModels()">Refresh</button>
        </div>
        <div class="models-grid" id="modelsGrid"></div>
        <div class="section-card">
            <h3>Vehicle Detection Classes</h3>
            <div class="class-grid" id="classGrid"></div>
        </div>
    </section>

    <!-- System Panel -->
    <section id="panel-system" class="panel">
        <div class="panel-header">
            <h2>System Information</h2>
            <button class="btn btn-sm" onclick="refreshSystem()">Refresh</button>
        </div>
        <div class="system-grid" id="systemGrid"></div>
        <div class="section-card">
            <h3>Health Check</h3>
            <div id="healthDetails"></div>
        </div>
    </section>

    <script src="/static/admin/admin.js"></script>
</body>
</html>
